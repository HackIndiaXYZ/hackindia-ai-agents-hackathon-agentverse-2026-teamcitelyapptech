<rect width="860" height="200" rx="18" fill="#151717"/>
<text x="28" y="40" font-size="13" class="mono" font-weight="700" fill="#EF5843">05</text><text x="62" y="41" font-size="19" font-weight="800" fill="#F2EFE7">Retrieve</text><text x="28" y="180" font-size="12" class="mono" fill="#8B908B">Dense and keyword candidates from the selected document context.</text><rect x="40" y="96" width="220" height="40" rx="20" fill="#F2EFE7"/><circle cx="64" cy="116" r="7" fill="#EF5843"/><text x="80" y="121" font-size="13" font-weight="700" fill="#151717">question</text><text x="284" y="122" font-size="20" font-weight="800" fill="#EF5843">→</text><text x="330" y="66" font-size="13" class="mono" fill="#8B908B">dense candidates</text><rect x="330" y="80" height="16" rx="5" fill="#EF5843"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.1250;0.2000;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="330" y="102" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.1700;0.2450;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="330" y="124" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.2150;0.2900;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="330" y="146" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;110;110;0" keyTimes="0;0.2600;0.3350;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><text x="590" y="66" font-size="13" class="mono" fill="#8B908B">keyword candidates</text><rect x="590" y="80" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.2000;0.2750;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="590" y="102" height="16" rx="5" fill="#EF5843"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.2450;0.3200;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="590" y="124" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.2900;0.3650;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="590" y="146" height="16" rx="5" fill="#2E3332"><animate attributeName="width" values="0;0;110;110;0" keyTimes="0;0.3350;0.4100;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect>
