<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .serif{font-family:Georgia,'Times New Roman',serif}
.sk{animation:pulse 1.8s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
