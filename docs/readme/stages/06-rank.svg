<rect width="860" height="200" rx="18" fill="#151717"/>
<text x="28" y="40" font-size="13" class="mono" font-weight="700" fill="#EF5843">06</text><text x="62" y="41" font-size="19" font-weight="800" fill="#F2EFE7">Rank</text><text x="28" y="180" font-size="12" class="mono" fill="#8B908B">Reciprocal Rank Fusion, optional rerank, neighbour expansion, token budget.</text><text x="40" y="66" font-size="13" class="mono" fill="#8B908B">RRF fusion</text><text x="330" y="66" font-size="13" class="mono" fill="#8B908B">rerank (optional FlashRank)</text><text x="620" y="66" font-size="13" class="mono" fill="#8B908B">context budget</text><rect x="40" y="80" width="220" height="16" rx="5" fill="#2E3332"/><rect x="330" y="80" width="200" height="16" rx="5" fill="#2E3332"><animate attributeName="y" values="80;80;102;102;80" keyTimes="0;0.2000;0.3750;0.9250;1" dur="4s" repeatCount="indefinite"/></rect><rect x="40" y="102" width="185" height="16" rx="5" fill="#2E3332"/><rect x="330" y="102" width="175" height="16" rx="5" fill="#EF5843"><animate attributeName="y" values="102;102;80;80;102" keyTimes="0;0.2000;0.3750;0.9250;1" dur="4s" repeatCount="indefinite"/></rect><rect x="40" y="124" width="150" height="16" rx="5" fill="#2E3332"/><rect x="330" y="124" width="150" height="16" rx="5" fill="#2E3332"><animate attributeName="y" values="124;124;146;146;124" keyTimes="0;0.2000;0.3750;0.9250;1" dur="4s" repeatCount="indefinite"/></rect><rect x="40" y="146" width="115" height="16" rx="5" fill="#2E3332"/><rect x="330" y="146" width="125" height="16" rx="5" fill="#2E3332"><animate attributeName="y" values="146;146;124;124;146" keyTimes="0;0.2000;0.3750;0.9250;1" dur="4s" repeatCount="indefinite"/></rect><rect x="620" y="96" width="200" height="22" rx="11" fill="none" stroke="#30363A" stroke-width="2"/><rect x="623" y="99" height="16" rx="8" fill="#F7E07A"><animate attributeName="width" values="0;0;150;150;0" keyTimes="0;0.4000;0.6500;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><text x="620" y="142" font-size="12" class="mono" fill="#8B908B">+ neighbour expansion</text>
