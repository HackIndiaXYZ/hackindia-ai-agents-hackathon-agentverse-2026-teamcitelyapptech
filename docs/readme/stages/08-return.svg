<text x="28" y="40" font-size="13" class="mono" font-weight="700" fill="#EF5843">08</text><text x="62" y="41" font-size="19" font-weight="800" fill="#F2EFE7">Return</text><text x="28" y="180" font-size="12" class="mono" fill="#8B908B">The reader renders valid exact ranges; work persists through the APIs.</text><rect x="60" y="56" width="420" height="100" rx="10" fill="#F2EFE7"/><rect x="80" y="70" width="380" height="7" fill="#CFCABD"/><rect x="80" y="86" width="380" height="7" fill="#CFCABD"/><rect x="80" y="102" width="300" height="7" fill="#CFCABD"/><rect x="80" y="118" width="380" height="7" fill="#CFCABD"/><rect x="80" y="134" width="380" height="7" fill="#CFCABD"/><rect x="76" y="97" height="16" rx="3" fill="#F7E07A"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.1500;0.3500;0.9250;1" dur="4.0s" repeatCount="indefinite"/></rect><rect x="80" y="102" width="300" height="5" fill="#8B908B"/><text x="500" y="86" font-size="12" class="mono" fill="#8B908B" opacity="0">page_char_start → page_char_end<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3250;0.3750;0.9250;1" dur="4.0s" repeatCount="indefinite"/></text><g opacity="0"><rect x="500" y="112" width="110" height="30" rx="15" fill="#F2EFE7"/><text x="555" y="132" text-anchor="middle" font-size="12" font-weight="800" fill="#151717">keep citation</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4500;0.4875;0.9250;1" dur="4.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="618" y="112" width="110" height="30" rx="15" fill="#F7E07A"/><text x="673" y="132" text-anchor="middle" font-size="12" font-weight="800" fill="#151717">highlight</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5375;0.5750;0.9250;1" dur="4.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="736" y="112" width="110" height="30" rx="15" fill="#6FB08E"/><text x="791" y="132" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">note rev 13</te