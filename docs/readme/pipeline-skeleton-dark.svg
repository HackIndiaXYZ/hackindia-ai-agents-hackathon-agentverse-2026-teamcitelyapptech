<rect width="1000" height="500" rx="18" fill="#151717"/>
<text x="40" y="48" font-size="15" font-weight="700" fill="#8B908B">Ingestion</text><text x="40" y="298" font-size="15" font-weight="700" fill="#8B908B">Question time</text><rect x="40" y="125.0" width="920" height="2" fill="#30363A"/><rect x="40" y="375.0" width="920" height="2" fill="#30363A"/><rect x="560" y="214" width="400" height="56" rx="12" fill="#202524" stroke="#30363A"/><text x="580" y="240" font-size="14" font-weight="700" fill="#F2EFE7">Qdrant</text><text x="580" y="259" font-size="12" class="mono" fill="#8B908B">dense vectors</text><text x="760" y="240" font-size="14" font-weight="700" fill="#F2EFE7">BM25 + originals</text><text x="760" y="259" font-size="12" class="mono" fill="#8B908B">persistent files</text><path d="M860 182 V214" stroke="#30363A" stroke-width="2" stroke-dasharray="5 5"/><path d="M660 270 C 660 300, 140 290, 140 320" fill="none" stroke="#30363A" stroke-width="2" stroke-dasharray="5 5"/><g><rect x="40" y="70" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.0400;0.0550;0.1600;0.2000;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="58" y="100" font-size="13" class="mono" font-weight="700" fill="#EF5843">01</text><text x="90" y="101" font-size="18" font-weight="800" fill="#F2EFE7">Upload</text><rect class="sk" style="animation-delay:0.00s" x="58" y="118" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.15s" x="58" y="133" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="58" y="166" font-size="12" class="mono" fill="#8B908B">owner + document id</text></g><g><rect x="280" y="70" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.1200;0.1350;0.2400;0.2800;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="298" y="100" font-size="13" class="mono" font-weight="700" fill="#EF5843">02</text><text x="330" y="101" font-size="18" font-weight="800" fill="#F2EFE7">Parse</text><rect class="sk" style="animation-delay:0.10s" x="298" y="118" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.25s" x="298" y="133" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="298" y="166" font-size="12" class="mono" fill="#8B908B">text, pages, anchors</text></g><g><rect x="520" y="70" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.2000;0.2150;0.3200;0.3600;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="538" y="100" font-size="13" class="mono" font-weight="700" fill="#EF5843">03</text><text x="570" y="101" font-size="18" font-weight="800" fill="#F2EFE7">Chunk</text><rect class="sk" style="animation-delay:0.20s" x="538" y="118" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.35s" x="538" y="133" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="538" y="166" font-size="12" class="mono" fill="#8B908B">source id + offsets</text></g><g><rect x="760" y="70" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.2800;0.2950;0.4000;0.4400;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="778" y="100" font-size="13" class="mono" font-weight="700" fill="#EF5843">04</text><text x="810" y="101" font-size="18" font-weight="800" fill="#F2EFE7">Index</text><rect class="sk" style="animation-delay:0.30s" x="778" y="118" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.45s" x="778" y="133" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="778" y="166" font-size="12" class="mono" fill="#8B908B">dense + BM25</text></g><g><rect x="40" y="320" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.5000;0.5150;0.6200;0.6600;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="58" y="350" font-size="13" class="mono" font-weight="700" fill="#EF5843">05</text><text x="90" y="351" font-size="18" font-weight="800" fill="#F2EFE7">Retrieve</text><rect class="sk" style="animation-delay:0.40s" x="58" y="368" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.55s" x="58" y="383" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="58" y="416" font-size="12" class="mono" fill="#8B908B">dense + keyword</text></g><g><rect x="280" y="320" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.5900;0.6050;0.7100;0.7500;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="298" y="350" font-size="13" class="mono" font-weight="700" fill="#EF5843">06</text><text x="330" y="351" font-size="18" font-weight="800" fill="#F2EFE7">Rank</text><rect class="sk" style="animation-delay:0.50s" x="298" y="368" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.65s" x="298" y="383" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="298" y="416" font-size="12" class="mono" fill="#8B908B">RRF, rerank, budget</text></g><g><rect x="520" y="320" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.6800;0.6950;0.8000;0.8400;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="538" y="350" font-size="13" class="mono" font-weight="700" fill="#EF5843">07</text><text x="570" y="351" font-size="18" font-weight="800" fill="#F2EFE7">Answer</text><rect class="sk" style="animation-delay:0.60s" x="538" y="368" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.75s" x="538" y="383" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="538" y="416" font-size="12" class="mono" fill="#8B908B">validated citations</text></g><g><rect x="760" y="320" width="200" height="112" rx="14" fill="#202524" stroke="#30363A" stroke-width="2"><animate attributeName="stroke" values="#30363A;#30363A;#EF5843;#EF5843;#30363A;#30363A" keyTimes="0;0.7700;0.7850;0.8900;0.9300;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="778" y="350" font-size="13" class="mono" font-weight="700" fill="#EF5843">08</text><text x="810" y="351" font-size="18" font-weight="800" fill="#F2EFE7">Return</text><rect class="sk" style="animation-delay:0.70s" x="778" y="368" width="151" height="7" rx="3.5" fill="#2E3332"/><rect class="sk" style="animation-delay:0.85s" x="778" y="383" width="95" height="7" rx="3.5" fill="#2E3332"/><text x="778" y="416" font-size="12" class="mono" fill="#8B908B">exact passage</text></g><g><rect x="-11" y="-9" width="22" height="18" rx="3" fill="#EF5843"><animate attributeName="opacity" values="0;1;1;1;1;1;0;0" keyTimes="0;0.0300;0.1100;0.1900;0.2700;0.3500;0.3900;1" dur="10.0s" repeatCount="indefinite"/></rect><animateTransform attributeName="transform" type="translate" values="140 56;140 56;380 56;620 56;860 56;860 242;860 242;860 242" keyTimes="0;0.0300;0.1100;0.1900;0.2700;0.3500;0.3900;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1"/></g><g><circle r="10" fill="#F7E07A" stroke="#F2EFE7" stroke-width="2"><animate attributeName="opacity" values="0;0;1;1;1;1;0;0" keyTimes="0;0.4500;0.4600;0.5900;0.6800;0.7700;0.9400;1" dur="10.0s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="140 306;140 306;140 306;380 306;620 306;860 306;860 306;860 306" keyTimes="0;0.4600;0.5000;0.5900;0.6800;0.7700;0.9400;1" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1;0.6 0 0.4 1"/></g><rect x="778" y="364" height="14" rx="3" fill="#F7E07A"><animate attributeName="width" values="0;0;164;164;0" keyTimes="0;0.7800;0.8500;0.9600;1" dur="10.0s" repeatCount="indefinite"/></rect><text x="40" y="472" font-size="13" fill="#8B908B">Source identity and location connect both paths, so every answer can return to the exact passage.</text>
