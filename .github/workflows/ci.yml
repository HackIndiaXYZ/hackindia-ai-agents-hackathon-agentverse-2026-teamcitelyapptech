name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact -c .gitleaks.toml

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      # No secrets needed: the suite stubs out RAGService and never calls
      # OpenAI, Qdrant or Cloudflare.
      - run: python -m unittest discover -s tests -v
      - run: python -c "import APP.main" && echo "APP.main imports OK"

  frontend-checks:
    name: Frontend typecheck + build + browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Citely-Modernist-Next-Final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Citely-Modernist-Next-Final/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          BASE_PATH: /dev
          NEXT_PUBLIC_VIEWER_DOCX: 'true'
          NEXT_PUBLIC_VIEWER_XLSX: 'true'
          NEXT_PUBLIC_VIEWER_PPTX: 'true'
          NEXT_PUBLIC_VIEWER_PDF: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
